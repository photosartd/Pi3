# @package _global_

# Mesh-free object-centric training on indexed MegaPose-GSO observations.
# References and queries use the same numeric GSO object ID and metric object
# frame, but every selected observation comes from a distinct rendered scene.
# Both references and queries receive the selected physical instance's mask as
# a model condition. This is required for scenes containing repeated GSO IDs:
# (scene_id, gt_id), rather than object_id alone, identifies the target copy.
# At deployment, an equivalent instance-specific query mask must come from the
# task input or an external segmenter; this is not an unconditioned benchmark.
# The preprocessing split manifest holds out 20% of target object IDs and 20%
# of source scene IDs. Training uses only train-object/train-scene intersections;
# validation uses only held-out-object/held-out-scene intersections.

primary_val: gso_val

gso:
  data_root: /vol/coro/dtrofimov/data/projects/gfm-6dof/datasets/MegaPose-GSO-fixed
  index_path: null
  split_path: null
  object_ids: all
  sampling_regime: independent_scenes
  # Evaluation stays independent-scene even when an inherited training profile
  # switches the train dataset to the stricter two-track anchor_pair regime.
  eval_sampling_regime: independent_scenes
  num_reference_range: ${gso_profile.num_reference_range}
  num_query_range: ${gso_profile.num_query_range}
  eval_num_reference: 5
  eval_num_query: 1
  eval_image_num: 6
  visibility_min: 0.1
  min_visible_pixels: 64
  depth_corruption_policy: clean_only
  reference_selection: random
  query_selection: random
  allow_repeat: false
  reference_rgb_masking: false
  query_rgb_masking: false
  depth_masking: true
  mask_type: mask_visib
  visibility_mask_conditioning: true
  condition_reference_visibility: true
  condition_query_visibility: true

_gso_dataset_base: &gso_dataset_base
  _target_: datasets.megapose_gso_dataset.MegaPoseGSOObjectDataset
  data_root: ${gso.data_root}
  index_path: ${gso.index_path}
  split_path: ${gso.split_path}
  object_ids: ${gso.object_ids}
  sampling_regime: ${gso.sampling_regime}
  num_reference_range: ${gso.num_reference_range}
  num_query_range: ${gso.num_query_range}
  visibility_min: ${gso.visibility_min}
  min_visible_pixels: ${gso.min_visible_pixels}
  depth_corruption_policy: ${gso.depth_corruption_policy}
  reference_selection: ${gso.reference_selection}
  query_selection: ${gso.query_selection}
  allow_repeat: ${gso.allow_repeat}
  reference_rgb_masking: ${gso.reference_rgb_masking}
  query_rgb_masking: ${gso.query_rgb_masking}
  depth_masking: ${gso.depth_masking}
  mask_type: ${gso.mask_type}
  visibility_mask_conditioning: ${gso.visibility_mask_conditioning}
  condition_reference_visibility: ${gso.condition_reference_visibility}
  condition_query_visibility: ${gso.condition_query_visibility}
  visibility_condition_corruption: none
  aug_crop: false
  aug_focal: false
  z_far: 0
  max_refetch: ${gso_profile.max_refetch}
  transform:
    _partial_: true
    _target_: datasets.base.transforms.ImgToTensor
  shuffle: false

train_dataset:
  length: auto
  weights:
    MegaPoseGSO: 10000
  MegaPoseGSO:
    <<: *gso_dataset_base
    scene_split: train
    mode: train

train_dataloader:
  drop_last: true
  shuffle: true

_gso_eval_base: &gso_eval_base
  <<: *gso_dataset_base
  sampling_regime: ${gso.eval_sampling_regime}
  num_reference_range:
    - ${gso.eval_num_reference}
    - ${gso.eval_num_reference}
  num_query_range:
    - ${gso.eval_num_query}
    - ${gso.eval_num_query}
  reference_selection: random
  query_selection: first
  allow_repeat: false
  resolution: ${train.resolution}
  mode: val

test_dataset:
  <<: *gso_eval_base
  scene_split: val
  mode: test

test_dataloader: &gso_eval_dataloader
  drop_last: false
  shuffle: false

val_datasets:
  gso_val:
    dataset:
      <<: *gso_eval_base
      scene_split: val
    dataloader: *gso_eval_dataloader
    runtime:
      image_num_range:
        - ${gso.eval_image_num}
        - ${gso.eval_image_num}
      max_img_per_gpu: ${test.max_img_per_gpu}
      iters_per_test: ${test.iters_per_test}
      num_workers: ${test.num_workers}
      print_freq: ${test.print_freq}
