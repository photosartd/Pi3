# @package _global_

# No-mask training control for the scene13/subscene19 anchor overfit probe.
# The model architecture is unchanged, but both reference and query visibility
# condition maps are zero/unknown during training.

defaults:
  - lmgeo_anchor_scene_overfit_scene13_sub19_query_masks
  - _self_

primary_val: overfit_scene_no_masks

lmgeo_anchor:
    condition_reference_visibility: false
    condition_query_visibility: false
    visibility_condition_corruption: none
