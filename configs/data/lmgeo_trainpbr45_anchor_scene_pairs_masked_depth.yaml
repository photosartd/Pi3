# @package _global_

# Same-object scene-pair LMGeo training.
#
# Each sample chooses one anchor object, keyframes from one scene/window where
# that object is visible, and query frames from another compatible scene/window
# where the same object is visible.  The reference and query windows may be the
# same, but selected query records are excluded from keyframes.  Model-side
# visibility conditioning is reference-only: references receive [mask, known],
# queries receive [0, 0].  This variant also uses object-only depth supervision.

primary_val: real_anchor_pairs

lmgeo:
    data_root: /vol/coro/dtrofimov/data/projects/gfm-6dof/datasets/lm-o
    models_folder: models_eval
    object_ids: all
    reference_split: train
    train_query_split: train_pbr
    test_query_split: test
    new_val_query_split: new_val
    query_scene_ids: all
    query_subscene_ids: all
    query_window_size: 25
    num_reference_range: ${lmgeo_profile.num_reference_range}
    num_query_range: ${lmgeo_profile.num_query_range}
    reference_rgb_masking: false
    query_rgb_masking: false
    depth_masking: true
    mask_type: mask_visib
    visibility_min: 0.1
    reference_selection: random
    query_selection: random
    depth_unit_scale: 0.001
    filter_center_crop_visibility: true
    min_center_crop_bbox_area: 1.0
    filter_preprocessed_query_depth: ${lmgeo_profile.filter_preprocessed_query_depth}
    min_preprocessed_query_depth_pixels: 1
    allow_repeat: ${lmgeo_profile.allow_repeat}
    symmetric_ids: [10, 11]

lmgeo_anchor:
    anchor_allow_same_scene: true
    anchor_allow_same_subscene: true
    anchor_selection_attempts: 50
    visibility_mask_conditioning: true
    condition_reference_visibility: true
    condition_query_visibility: false
    val_min_query_records: 6

_anchor_pair_train_base: &anchor_pair_train_base
    _target_: datasets.lmgeo_dataset.LMGeoAnchorScenePairSequenceDataset
    data_root: ${lmgeo.data_root}
    object_ids: ${lmgeo.object_ids}
    reference_split: ${lmgeo.reference_split}
    query_split: ${lmgeo.train_query_split}
    query_scene_ids: ${lmgeo.query_scene_ids}
    query_subscene_ids: ${lmgeo.query_subscene_ids}
    query_window_size: ${lmgeo.query_window_size}
    query_source: windows
    num_reference_range: ${lmgeo.num_reference_range}
    num_query_range: ${lmgeo.num_query_range}
    reference_rgb_masking: ${lmgeo.reference_rgb_masking}
    query_rgb_masking: ${lmgeo.query_rgb_masking}
    depth_masking: ${lmgeo.depth_masking}
    mask_type: ${lmgeo.mask_type}
    visibility_min: ${lmgeo.visibility_min}
    reference_selection: ${lmgeo.reference_selection}
    query_selection: ${lmgeo.query_selection}
    depth_unit_scale: ${lmgeo.depth_unit_scale}
    filter_center_crop_visibility: ${lmgeo.filter_center_crop_visibility}
    min_center_crop_bbox_area: ${lmgeo.min_center_crop_bbox_area}
    filter_preprocessed_query_depth: ${lmgeo.filter_preprocessed_query_depth}
    min_preprocessed_query_depth_pixels: ${lmgeo.min_preprocessed_query_depth_pixels}
    allow_repeat: ${lmgeo.allow_repeat}
    visibility_mask_conditioning: ${lmgeo_anchor.visibility_mask_conditioning}
    condition_reference_visibility: ${lmgeo_anchor.condition_reference_visibility}
    condition_query_visibility: ${lmgeo_anchor.condition_query_visibility}
    anchor_allow_same_scene: ${lmgeo_anchor.anchor_allow_same_scene}
    anchor_allow_same_subscene: ${lmgeo_anchor.anchor_allow_same_subscene}
    anchor_selection_attempts: ${lmgeo_anchor.anchor_selection_attempts}
    aug_crop: false
    aug_focal: false
    z_far: 0
    max_refetch: ${lmgeo_profile.max_refetch}
    transform:
        _partial_: true
        _target_: datasets.base.transforms.ImgToTensor
    shuffle: false

train_dataset:
    length: auto
    weights:
        LMGeoAnchorScenePair: 10000
    LMGeoAnchorScenePair:
        <<: *anchor_pair_train_base
        mode: train

train_dataloader:
    drop_last: true
    shuffle: true

_anchor_pair_val_base: &anchor_pair_val_base
    <<: *anchor_pair_train_base
    num_reference_range: [5, 5]
    num_query_range: [1, 1]
    reference_selection: random
    query_selection: first
    filter_preprocessed_query_depth: false
    allow_repeat: false
    min_query_records: ${lmgeo_anchor.val_min_query_records}
    resolution: ${train.resolution}
    mode: val

_real_anchor_pair_dataset: &real_anchor_pair_dataset
    <<: *anchor_pair_val_base
    query_split: ${lmgeo.test_query_split}
    mode: test

_pbr_anchor_pair_dataset: &pbr_anchor_pair_dataset
    <<: *anchor_pair_val_base
    query_split: ${lmgeo.new_val_query_split}
    mode: val

test_dataset: *real_anchor_pair_dataset
test_dataloader: &default_test_dataloader
    drop_last: false
    shuffle: false

val_datasets:
    real_anchor_pairs:
        dataset: *real_anchor_pair_dataset
        dataloader: *default_test_dataloader
        runtime:
            image_num_range: [6, 6]
            max_img_per_gpu: ${test.max_img_per_gpu}
            iters_per_test: 0
            num_workers: ${test.num_workers}
            print_freq: ${test.print_freq}
    pbr_anchor_pairs:
        dataset: *pbr_anchor_pair_dataset
        dataloader: *default_test_dataloader
        runtime:
            image_num_range: [6, 6]
            max_img_per_gpu: ${test.max_img_per_gpu}
            iters_per_test: 0
            num_workers: ${test.num_workers}
            print_freq: ${test.print_freq}
