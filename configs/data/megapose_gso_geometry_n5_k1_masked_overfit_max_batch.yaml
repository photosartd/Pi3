# @package _global_

# Maximum-memory fixed-batch memorization probe: 24 distinct deterministic
# N=5/K=1 samples x 6 views = 144 images/rank at 336x252.
defaults:
  - megapose_gso_geometry_n5_k1_masked_overfit_one_batch
  - _self_

gso:
  # First 24 train-split objects with prepared scene-reference geometry plans.
  object_ids:
    - 0
    - 1
    - 3
    - 4
    - 5
    - 6
    - 7
    - 8
    - 9
    - 10
    - 12
    - 13
    - 14
    - 17
    - 18
    - 20
    - 21
    - 22
    - 23
    - 24
    - 25
    - 27
    - 28
    - 29

train_dataset:
  # A 144-image budget yields 24 samples/batch. The extra repeated index keeps
  # the loader's strict required_indices < dataset_length invariant true.
  # Each epoch's first batch contains all 24 eligible objects; only order may
  # change, which cannot change per-sample model outputs.
  length: 25
  GSOSceneGeometryN5K1:
    protocol_name: geometry_scene_n5_k1_masked_overfit_max_batch_24

val_datasets:
  gso_geometry_overfit_train_batch:
    runtime:
      # Override the one-sample parent's explicit named-validation budget so
      # metrics are aggregated over the same fixed 24-sample training batch.
      max_img_per_gpu: 144
