        query_subscene_id: 35
        mode: train
    LMGeo_04:
        <<: *lmgeo_dataset_base
        query_scene_id: 3
        query_subscene_id: 5
        mode: train
    LMGeo_05:
        <<: *lmgeo_dataset_base
        query_scene_id: 39
        query_subscene_id: 20
        mode: train
    LMGeo_06:
        <<: *lmgeo_dataset_base
        query_scene_id: 23
        query_subscene_id: 37
        mode: train
    LMGeo_07:
        <<: *lmgeo_dataset_base
        query_scene_id: 49
        query_subscene_id: 19
        mode: train
    LMGeo_08:
        <<: *lmgeo_dataset_base
