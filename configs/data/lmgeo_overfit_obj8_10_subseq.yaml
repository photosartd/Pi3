        <<: *lmgeo_dataset_base
        query_scene_id: 5
        query_subscene_id: 35
        mode: test
    LMGeo_04:
        <<: *lmgeo_dataset_base
        query_scene_id: 3
        query_subscene_id: 5
        mode: test
    LMGeo_05:
        <<: *lmgeo_dataset_base
