# @package _global_

# LM-O object-centric training with two validation splits:
# 1. real_test: official BOP19 real-image LM-O test targets.
# 2. pbr_new_val: held-out PBR folders moved from train_pbr/000045-000049
#    to new_val/000045-000049.
#
# References/keyframes always come from train/<object_id> render views.
# Training queries come from train_pbr, which now excludes scenes 45-49.

primary_val: real_test

lmgeo:
    data_root: /vol/coro/dtrofimov/data/projects/gfm-6dof/datasets/lm-o
    models_folder: models_eval
    object_ids: all
    reference_split: train
    train_query_split: train_pbr
    test_query_split: test
    new_val_query_split: new_val
    query_target_file: lmo/test_targets_bop19.json
    query_scene_ids: all
    query_subscene_ids: all
    query_window_size: 25
    num_reference_range: [5, 6]
    num_query_range: [1, 20]
    reference_rgb_masking: true
    query_rgb_masking: false
    depth_masking: true
    mask_type: mask_visib
    visibility_min: 0.1
    reference_selection: random
    query_selection: random
    depth_unit_scale: 0.001
    filter_center_crop_visibility: true
    min_center_crop_bbox_area: 1.0
    # Keep this off for long training runs. The preprocessed-depth check scans
    # every candidate RGB/depth/mask through Pi3 preprocessing during dataset
    # construction, which can stall startup for many minutes. The previous
    # successful 30-epoch run also used this as false.
    filter_preprocessed_query_depth: false
    min_preprocessed_query_depth_pixels: 1
    allow_repeat: false
    symmetric_ids: [10, 11]

train:
    # The dataset splits the sampled total into N_ref + K_query.
    # With ranges below: min 5+1=6, max 6+20=26.
    image_num_range: [6, 26]
    max_img_per_gpu: 50

test:
    # Validation baseline: 5 uniform reference renders + 1 query.
    image_num_range: [6, 6]
    max_img_per_gpu: 96
    iters_per_test: 0

_lmgeo_sequence_train_base: &lmgeo_sequence_train_base
    _target_: datasets.lmgeo_dataset.LMGeoSequenceDataset
    data_root: ${lmgeo.data_root}
    object_ids: ${lmgeo.object_ids}
    reference_split: ${lmgeo.reference_split}
    query_split: ${lmgeo.train_query_split}
    query_scene_ids: ${lmgeo.query_scene_ids}
    query_subscene_ids: ${lmgeo.query_subscene_ids}
    query_window_size: ${lmgeo.query_window_size}
    query_source: auto
    num_reference_range: ${lmgeo.num_reference_range}
    num_query_range: ${lmgeo.num_query_range}
    reference_rgb_masking: ${lmgeo.reference_rgb_masking}
    query_rgb_masking: ${lmgeo.query_rgb_masking}
    depth_masking: ${lmgeo.depth_masking}
    mask_type: ${lmgeo.mask_type}
    visibility_min: ${lmgeo.visibility_min}
    reference_selection: ${lmgeo.reference_selection}
    query_selection: ${lmgeo.query_selection}
    depth_unit_scale: ${lmgeo.depth_unit_scale}
    filter_center_crop_visibility: ${lmgeo.filter_center_crop_visibility}
    min_center_crop_bbox_area: ${lmgeo.min_center_crop_bbox_area}
    filter_preprocessed_query_depth: ${lmgeo.filter_preprocessed_query_depth}
    min_preprocessed_query_depth_pixels: ${lmgeo.min_preprocessed_query_depth_pixels}
    allow_repeat: ${lmgeo.allow_repeat}
    aug_crop: false
    aug_focal: false
    z_far: 0
    transform:
        _partial_: true
        _target_: datasets.base.transforms.ImgToTensor
    shuffle: false

train_dataset:
    length: 10000
    weights:
        LMGeoSequence: 10000
    LMGeoSequence:
        <<: *lmgeo_sequence_train_base
        mode: train

train_dataloader:
    drop_last: true
    shuffle: true

_real_test_dataset: &real_test_dataset
    _target_: datasets.lmgeo_dataset.LMGeoSequenceDataset
    data_root: ${lmgeo.data_root}
    object_ids: ${lmgeo.object_ids}
    reference_split: ${lmgeo.reference_split}
    query_split: ${lmgeo.test_query_split}
    query_target_file: ${lmgeo.query_target_file}
    query_window_size: ${lmgeo.query_window_size}
    query_source: auto
    num_reference_range: [5, 5]
    num_query_range: [1, 1]
    reference_rgb_masking: ${lmgeo.reference_rgb_masking}
    query_rgb_masking: ${lmgeo.query_rgb_masking}
    depth_masking: ${lmgeo.depth_masking}
    mask_type: ${lmgeo.mask_type}
    visibility_min: 0.0
    reference_selection: uniform
    query_selection: first
    depth_unit_scale: ${lmgeo.depth_unit_scale}
    filter_center_crop_visibility: ${lmgeo.filter_center_crop_visibility}
    min_center_crop_bbox_area: ${lmgeo.min_center_crop_bbox_area}
    filter_preprocessed_query_depth: false
    filter_target_center_crop_visibility: true
    filter_target_preprocessed_depth: true
    min_preprocessed_query_depth_pixels: ${lmgeo.min_preprocessed_query_depth_pixels}
    allow_repeat: ${lmgeo.allow_repeat}
    aug_crop: false
    aug_focal: false
    z_far: 0
    resolution: ${train.resolution}
    transform:
        _partial_: true
        _target_: datasets.base.transforms.ImgToTensor
    shuffle: false
    mode: test

_pbr_new_val_dataset: &pbr_new_val_dataset
    _target_: datasets.lmgeo_dataset.LMGeoSequenceDataset
    data_root: ${lmgeo.data_root}
    object_ids: ${lmgeo.object_ids}
    reference_split: ${lmgeo.reference_split}
    query_split: ${lmgeo.new_val_query_split}
    query_scene_ids: all
    query_subscene_ids: all
    query_window_size: ${lmgeo.query_window_size}
    query_source: windows
    num_reference_range: [5, 5]
    num_query_range: [1, 1]
    reference_rgb_masking: ${lmgeo.reference_rgb_masking}
    query_rgb_masking: ${lmgeo.query_rgb_masking}
    depth_masking: ${lmgeo.depth_masking}
    mask_type: ${lmgeo.mask_type}
    visibility_min: ${lmgeo.visibility_min}
    reference_selection: uniform
    query_selection: first
    depth_unit_scale: ${lmgeo.depth_unit_scale}
    filter_center_crop_visibility: ${lmgeo.filter_center_crop_visibility}
    min_center_crop_bbox_area: ${lmgeo.min_center_crop_bbox_area}
    filter_preprocessed_query_depth: ${lmgeo.filter_preprocessed_query_depth}
    min_preprocessed_query_depth_pixels: ${lmgeo.min_preprocessed_query_depth_pixels}
    allow_repeat: ${lmgeo.allow_repeat}
    aug_crop: false
    aug_focal: false
    z_far: 0
    resolution: ${train.resolution}
    transform:
        _partial_: true
        _target_: datasets.base.transforms.ImgToTensor
    shuffle: false
    mode: val

# Keep the historical single-test keys as the real validation loader for
# compatibility with older tools/scripts.
test_dataset: *real_test_dataset
test_dataloader: &default_test_dataloader
    drop_last: false
    shuffle: false

val_datasets:
    real_test:
        dataset: *real_test_dataset
        dataloader: *default_test_dataloader
        runtime:
            image_num_range: [6, 6]
            max_img_per_gpu: 96
            iters_per_test: 0
            num_workers: ${test.num_workers}
            print_freq: ${test.print_freq}
    pbr_new_val:
        dataset: *pbr_new_val_dataset
        dataloader: *default_test_dataloader
        runtime:
            image_num_range: [6, 6]
            max_img_per_gpu: 96
            iters_per_test: 0
            num_workers: ${test.num_workers}
            print_freq: ${test.print_freq}
    pbr_new_val_k5_subset:
        dataset:
            <<: *pbr_new_val_dataset
            num_query_range: [5, 5]
            query_selection: uniform
            max_query_subsequences: 160
        dataloader: *default_test_dataloader
        runtime:
            # 5 reference renders + 5 query frames from the same 25-frame window.
            image_num_range: [10, 10]
            max_img_per_gpu: 96
            iters_per_test: 0
            num_workers: ${test.num_workers}
            print_freq: ${test.print_freq}
    pbr_new_val_k10_subset:
        dataset:
            <<: *pbr_new_val_dataset
            num_query_range: [10, 10]
            query_selection: uniform
            max_query_subsequences: 160
        dataloader: *default_test_dataloader
        runtime:
            # 5 reference renders + 10 query frames from the same 25-frame window.
            image_num_range: [15, 15]
            max_img_per_gpu: 96
            iters_per_test: 0
            num_workers: ${test.num_workers}
            print_freq: ${test.print_freq}
