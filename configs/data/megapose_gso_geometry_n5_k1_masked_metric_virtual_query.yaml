# @package _global_

# Minimal metric-scale/virtual-query experiment. Reuse the existing geometry
# feature and N=5 plan databases exactly as built. Their historical focal
# feasibility filter therefore still limits pair capacity, but the query crop
# selected by that filter is replaced at materialization time by a calibrated
# virtual camera with independent zoom.
defaults:
  - megapose_gso_geometry_n5_k1_masked
  - _self_

train_dataset:
  GSOSceneGeometryN5K1:
    protocol_name: geometry_scene_n5_k1_masked_metric_virtual_query
    virtual_camera_rectification: &virtual_query
      roles: [query]
      bbox_key: bbox_obj
      # Log-uniform sampling covers mild and strong zoom without concentrating
      # most samples near 5x. The amodal bbox safety bound can lower any draw
      # that would remove part of the object (including a 5% margin).
      zoom_range: [1.0, 5.0]
      eval_zoom: 3.0
      zoom_sampling: log_uniform
      principal_point: image_center
      bbox_margin_fraction: 0.05
      safe_zoom: true
      replace_planned_crop: true
      depth_interpolation: nearest
      min_valid_depth_pixels: 64
  GSORenderGeometryN5K1:
    protocol_name: geometry_render_n5_k1_masked_metric_virtual_query
    virtual_camera_rectification: *virtual_query

test_dataset:
  protocol_name: geometry_val_scene_n5_k1_masked_metric_virtual_query
  virtual_camera_rectification: *virtual_query

val_datasets:
  gso_geometry_val_scene_n5_k1:
    dataset:
      protocol_name: geometry_val_scene_n5_k1_masked_metric_virtual_query
      virtual_camera_rectification: *virtual_query
  gso_geometry_val_render_n5_k1:
    dataset:
      protocol_name: geometry_val_render_n5_k1_masked_metric_virtual_query
      virtual_camera_rectification: *virtual_query
