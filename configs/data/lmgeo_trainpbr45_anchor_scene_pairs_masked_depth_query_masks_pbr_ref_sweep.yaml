# @package _global_

# Query-mask oracle anchor-scene-pair data profile with synthetic/PBR-only
# validation at N=5/10/15 keyframes and K=1 query.  RGB stays unmasked; depth
# supervision stays object-mask-only; both reference and query views receive
# GT visibility-mask conditioning.
defaults:
  - lmgeo_trainpbr45_anchor_scene_pairs_masked_depth_query_masks
  - _self_

primary_val: pbr_anchor_pairs_ref5

lmgeo_anchor:
    # Higher-N validation is more sensitive to unlucky same-scene/query overlap,
    # because selected query records are removed from refs.  More attempts keep
    # sampling robust while preserving the random same-object scene-pair policy.
    anchor_selection_attempts: 200

_pbr_anchor_pair_val_base: &pbr_anchor_pair_val_base
    _target_: datasets.lmgeo_dataset.LMGeoAnchorScenePairSequenceDataset
    data_root: ${lmgeo.data_root}
    object_ids: ${lmgeo.object_ids}
    reference_split: ${lmgeo.reference_split}
    query_split: ${lmgeo.new_val_query_split}
    query_scene_ids: ${lmgeo.query_scene_ids}
    query_subscene_ids: ${lmgeo.query_subscene_ids}
    query_window_size: ${lmgeo.query_window_size}
    query_source: windows
    num_reference_range: [5, 5]
    num_query_range: [1, 1]
    reference_rgb_masking: ${lmgeo.reference_rgb_masking}
    query_rgb_masking: ${lmgeo.query_rgb_masking}
    depth_masking: ${lmgeo.depth_masking}
    mask_type: ${lmgeo.mask_type}
    visibility_min: ${lmgeo.visibility_min}
    reference_selection: random
    query_selection: first
    depth_unit_scale: ${lmgeo.depth_unit_scale}
    filter_center_crop_visibility: ${lmgeo.filter_center_crop_visibility}
    min_center_crop_bbox_area: ${lmgeo.min_center_crop_bbox_area}
    filter_preprocessed_query_depth: false
    min_preprocessed_query_depth_pixels: ${lmgeo.min_preprocessed_query_depth_pixels}
    allow_repeat: false
    min_query_records: 6
    visibility_mask_conditioning: ${lmgeo_anchor.visibility_mask_conditioning}
    condition_reference_visibility: ${lmgeo_anchor.condition_reference_visibility}
    condition_query_visibility: ${lmgeo_anchor.condition_query_visibility}
    visibility_condition_corruption: ${lmgeo_anchor.visibility_condition_corruption}
    visibility_condition_shift_fraction: ${lmgeo_anchor.visibility_condition_shift_fraction}
    anchor_reference_windows: ${lmgeo_anchor.anchor_reference_windows}
    anchor_reference_query_split: ${lmgeo_anchor.anchor_reference_query_split}
    anchor_allow_same_scene: ${lmgeo_anchor.anchor_allow_same_scene}
    anchor_allow_same_subscene: ${lmgeo_anchor.anchor_allow_same_subscene}
    anchor_selection_attempts: ${lmgeo_anchor.anchor_selection_attempts}
    aug_crop: false
    aug_focal: false
    z_far: 0
    resolution: ${train.resolution}
    transform:
        _partial_: true
        _target_: datasets.base.transforms.ImgToTensor
    shuffle: false
    mode: val

val_datasets:
    # Keep inherited keys present for tooling/Slurm override compatibility, but
    # this profile intentionally evaluates only synthetic/PBR anchor pairs.
    real_anchor_pairs:
        enabled: false
    pbr_anchor_pairs:
        enabled: false

    pbr_anchor_pairs_ref5:
        dataset:
            <<: *pbr_anchor_pair_val_base
            num_reference_range: [5, 5]
            min_query_records: 6
        dataloader: ${test_dataloader}
        runtime:
            image_num_range: [6, 6]
            max_img_per_gpu: 26
            iters_per_test: 0
            num_workers: ${test.num_workers}
            print_freq: ${test.print_freq}

    pbr_anchor_pairs_ref10:
        dataset:
            <<: *pbr_anchor_pair_val_base
            num_reference_range: [10, 10]
            min_query_records: 10
        dataloader: ${test_dataloader}
        runtime:
            image_num_range: [11, 11]
            max_img_per_gpu: 26
            iters_per_test: 0
            num_workers: ${test.num_workers}
            print_freq: ${test.print_freq}

    pbr_anchor_pairs_ref15:
        dataset:
            <<: *pbr_anchor_pair_val_base
            num_reference_range: [15, 15]
            min_query_records: 15
        dataloader: ${test_dataloader}
        runtime:
            image_num_range: [16, 16]
            max_img_per_gpu: 26
            iters_per_test: 0
            num_workers: ${test.num_workers}
            print_freq: ${test.print_freq}
