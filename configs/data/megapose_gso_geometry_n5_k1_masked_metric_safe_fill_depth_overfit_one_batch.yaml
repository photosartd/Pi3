# @package _global_

# One deterministic scene-to-scene sample for testing whether the new metric
# depth pathway and safe-fill data path can memorize a fixed batch.
defaults:
  - megapose_gso_geometry_n5_k1_masked_metric_safe_fill_depth
  - _self_

primary_val: gso_geometry_overfit_train_batch

gso:
  object_ids: [0]

train_dataset:
  length: 11
  weights:
    GSOSceneGeometryN5K1: 1
    GSORenderGeometryN5K1: 0
  GSOSceneGeometryN5K1:
    protocol_name: geometry_scene_n5_k1_metric_safe_fill_depth_overfit
    resolution: ${train.resolution}
    photometric_augmentation: false
    sampling_policy:
      crop_center_jitter: 0.0
      plan_selection: first
      random_focal_target: false
      per_view_focal_targets: false
      reference_selection: first
      query_selection: first
      enforce_focal_compatibility: false
    virtual_camera_rectification:
      safe_fill_fraction_range: [0.9, 0.9]
      eval_safe_fill_fraction: 0.9

train_dataloader:
  drop_last: true
  shuffle: false

test_dataset: ${train_dataset.GSOSceneGeometryN5K1}

test_dataloader:
  drop_last: false
  shuffle: false

val_datasets:
  gso_geometry_val_scene_n5_k1:
    enabled: false
  gso_geometry_val_render_n5_k1:
    enabled: false
  gso_geometry_overfit_train_batch:
    dataset: ${train_dataset.GSOSceneGeometryN5K1}
    dataloader: ${test_dataloader}
    runtime:
      image_num_range: [6, 6]
      max_img_per_gpu: 6
      iters_per_test: 1
      num_workers: 0
      print_freq: 1
