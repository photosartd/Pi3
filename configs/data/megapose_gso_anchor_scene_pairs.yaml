# @package _global_

# Strict two-track MegaPose-GSO production protocol. Every reference comes from
# one physical (scene_id, gt_id) track and every query comes from a second track
# of the same GSO object in a different scene. Frames never repeat. Validation
# uses the same anchor-pair semantics; use megapose_gso_cross_scene explicitly
# only for sparse/local data that cannot provide sufficiently long tracks.
defaults:
  - megapose_gso_cross_scene
  - _self_

gso:
  sampling_regime: anchor_pair
  eval_sampling_regime: anchor_pair
