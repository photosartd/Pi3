# @package _global_

# Fixed cross-scene anchor overfit probe.
#
# References/keyframes are forced to train_pbr scene 13, subscene 19.  Query
# frames are forced to train_pbr scene 3, subscene 25.  Each sample is still one
# anchor object in object-centric coordinates; a batch can contain multiple
# objects/masks as separate samples.  RGB stays unmasked, object-depth
# supervision is used, and GT visibility masks are supplied to the conditioning
# branch for both keyframes and the single query.

primary_val: cross_scene_correct_masks

lmgeo:
    data_root: /vol/coro/dtrofimov/data/projects/gfm-6dof/datasets/lm-o
    models_folder: models_eval
    object_ids: all
    reference_split: train
    train_query_split: train_pbr
    test_query_split: train_pbr
    new_val_query_split: train_pbr
    query_scene_ids: [3]
    query_subscene_ids: [25]
    query_window_size: 25
    num_reference_range: ${lmgeo_profile.num_reference_range}
    num_query_range: ${lmgeo_profile.num_query_range}
    reference_rgb_masking: false
    query_rgb_masking: false
    depth_masking: true
    mask_type: mask_visib
    visibility_min: 0.1
    reference_selection: random
    query_selection: random
    depth_unit_scale: 0.001
    filter_center_crop_visibility: true
    min_center_crop_bbox_area: 1.0
    filter_preprocessed_query_depth: ${lmgeo_profile.filter_preprocessed_query_depth}
    min_preprocessed_query_depth_pixels: 1
    allow_repeat: ${lmgeo_profile.allow_repeat}
    symmetric_ids: [10, 11]

lmgeo_profile:
    num_reference_range: [5, 5]
    num_query_range: [1, 1]
    filter_preprocessed_query_depth: false
    allow_repeat: false
    max_refetch: 50

lmgeo_anchor:
    anchor_reference_query_split: train_pbr
    anchor_reference_windows:
      - {object_id: 1, query_scene_id: 13, query_subscene_id: 19}
      - {object_id: 5, query_scene_id: 13, query_subscene_id: 19}
      - {object_id: 6, query_scene_id: 13, query_subscene_id: 19}
      - {object_id: 8, query_scene_id: 13, query_subscene_id: 19}
      - {object_id: 9, query_scene_id: 13, query_subscene_id: 19}
      - {object_id: 10, query_scene_id: 13, query_subscene_id: 19}
      - {object_id: 11, query_scene_id: 13, query_subscene_id: 19}
      - {object_id: 12, query_scene_id: 13, query_subscene_id: 19}
    anchor_allow_same_scene: false
    anchor_allow_same_subscene: false
    anchor_selection_attempts: 50
    visibility_mask_conditioning: true
    condition_reference_visibility: true
    condition_query_visibility: true
    visibility_condition_corruption: none
    visibility_condition_shift_fraction: 0.5
    val_min_query_records: 6

_cross_scene_train_base: &cross_scene_train_base
    _target_: datasets.lmgeo_dataset.LMGeoAnchorScenePairSequenceDataset
    data_root: ${lmgeo.data_root}
    object_ids: ${lmgeo.object_ids}
    reference_split: ${lmgeo.reference_split}
    query_split: ${lmgeo.train_query_split}
    query_scene_ids: ${lmgeo.query_scene_ids}
    query_subscene_ids: ${lmgeo.query_subscene_ids}
    query_window_size: ${lmgeo.query_window_size}
    query_source: windows
    num_reference_range: ${lmgeo.num_reference_range}
    num_query_range: ${lmgeo.num_query_range}
    reference_rgb_masking: ${lmgeo.reference_rgb_masking}
    query_rgb_masking: ${lmgeo.query_rgb_masking}
    depth_masking: ${lmgeo.depth_masking}
    mask_type: ${lmgeo.mask_type}
    visibility_min: ${lmgeo.visibility_min}
    reference_selection: ${lmgeo.reference_selection}
    query_selection: ${lmgeo.query_selection}
    depth_unit_scale: ${lmgeo.depth_unit_scale}
    filter_center_crop_visibility: ${lmgeo.filter_center_crop_visibility}
    min_center_crop_bbox_area: ${lmgeo.min_center_crop_bbox_area}
    filter_preprocessed_query_depth: ${lmgeo.filter_preprocessed_query_depth}
    min_preprocessed_query_depth_pixels: ${lmgeo.min_preprocessed_query_depth_pixels}
    allow_repeat: ${lmgeo.allow_repeat}
    visibility_mask_conditioning: ${lmgeo_anchor.visibility_mask_conditioning}
    condition_reference_visibility: ${lmgeo_anchor.condition_reference_visibility}
    condition_query_visibility: ${lmgeo_anchor.condition_query_visibility}
    visibility_condition_corruption: ${lmgeo_anchor.visibility_condition_corruption}
    visibility_condition_shift_fraction: ${lmgeo_anchor.visibility_condition_shift_fraction}
    anchor_reference_windows: ${lmgeo_anchor.anchor_reference_windows}
    anchor_reference_query_split: ${lmgeo_anchor.anchor_reference_query_split}
    anchor_allow_same_scene: ${lmgeo_anchor.anchor_allow_same_scene}
    anchor_allow_same_subscene: ${lmgeo_anchor.anchor_allow_same_subscene}
    anchor_selection_attempts: ${lmgeo_anchor.anchor_selection_attempts}
    aug_crop: false
    aug_focal: false
    z_far: 0
    max_refetch: ${lmgeo_profile.max_refetch}
    transform:
        _partial_: true
        _target_: datasets.base.transforms.ImgToTensor
    shuffle: false

train_dataset:
    length: auto
    weights:
        LMGeoAnchorScenePair: 256
    LMGeoAnchorScenePair:
        <<: *cross_scene_train_base
        mode: train

train_dataloader:
    drop_last: true
    shuffle: true

_cross_scene_val_correct_dataset: &cross_scene_val_correct_dataset
    <<: *cross_scene_train_base
    query_split: ${lmgeo.test_query_split}
    num_reference_range: [5, 5]
    num_query_range: [1, 1]
    reference_selection: random
    query_selection: first
    filter_preprocessed_query_depth: false
    allow_repeat: false
    min_query_records: ${lmgeo_anchor.val_min_query_records}
    condition_reference_visibility: true
    condition_query_visibility: true
    visibility_condition_corruption: none
    resolution: ${train.resolution}
    mode: val

_cross_scene_val_shifted_dataset: &cross_scene_val_shifted_dataset
    <<: *cross_scene_val_correct_dataset
    visibility_condition_corruption: shift
    visibility_condition_shift_fraction: 0.5

_cross_scene_val_no_masks_dataset: &cross_scene_val_no_masks_dataset
    <<: *cross_scene_val_correct_dataset
    condition_reference_visibility: false
    condition_query_visibility: false
    visibility_condition_corruption: none

test_dataset: *cross_scene_val_correct_dataset
test_dataloader: &cross_scene_test_dataloader
    drop_last: false
    shuffle: false

val_datasets:
    cross_scene_correct_masks:
        dataset: *cross_scene_val_correct_dataset
        dataloader: *cross_scene_test_dataloader
        runtime:
            image_num_range: [6, 6]
            max_img_per_gpu: ${test.max_img_per_gpu}
            iters_per_test: 0
            num_workers: ${test.num_workers}
            print_freq: ${test.print_freq}
    cross_scene_shifted_masks:
        dataset: *cross_scene_val_shifted_dataset
        dataloader: *cross_scene_test_dataloader
        runtime:
            image_num_range: [6, 6]
            max_img_per_gpu: ${test.max_img_per_gpu}
            iters_per_test: 0
            num_workers: ${test.num_workers}
            print_freq: ${test.print_freq}
    cross_scene_no_masks:
        dataset: *cross_scene_val_no_masks_dataset
        dataloader: *cross_scene_test_dataloader
        runtime:
            image_num_range: [6, 6]
            max_img_per_gpu: ${test.max_img_per_gpu}
            iters_per_test: 0
            num_workers: ${test.num_workers}
            print_freq: ${test.print_freq}
