# @package _global_

model:
    _target_: pi3.models.pi3_training.Pi3
    pos_type: rope100
    decoder_size: large
    load_vggt: true
    freeze_encoder: true
    use_global_points: false
    train_conf: false
    num_dec_blk_not_to_checkpoint: 4
    dino_output_layers: []
    ckpt: null # <path-to-your-pretrain-checkpoint>

loss:
    train_loss: 
        _target_: pi3.models.loss.Pi3Loss
        train_conf: false
        correspondence_weight: 0.0
        correspondence_patch_size: 14
        correspondence_max_reference_per_query: 1
        correspondence_reference_selection: uniform
        correspondence_max_pairs: 512
        correspondence_pair_subsample: uniform
        correspondence_depth_abs_tol: 0.01
        correspondence_depth_rel_tol: 0.05
        correspondence_huber_beta: 0.01
        correspondence_use_dino_weights: false
        correspondence_dino_layer: 17
        correspondence_dino_center: 0.2
        correspondence_dino_temperature: 0.1
        correspondence_min_dino_weight: 0.05

    test_loss:
        _target_: pi3.models.loss.Pi3Loss
        train_conf: false
        correspondence_weight: 0.0
        correspondence_patch_size: 14
        correspondence_max_reference_per_query: 1
        correspondence_reference_selection: uniform
        correspondence_max_pairs: 512
        correspondence_pair_subsample: uniform
        correspondence_depth_abs_tol: 0.01
        correspondence_depth_rel_tol: 0.05
        correspondence_huber_beta: 0.01
        correspondence_use_dino_weights: false
        correspondence_dino_layer: 17
        correspondence_dino_center: 0.2
        correspondence_dino_temperature: 0.1
        correspondence_min_dino_weight: 0.05

train:
    num_workers: 16
    batch_size: 1              # not use, dynamic batch size
    num_epoch: 80
    iters_per_epoch: 800

    print_freq: 40
    base_seed: 666

    model_dtype: bf16
    # dynamic complie
    dynamo_backend: NO  # CUDAGRAPHS  # INDUCTOR  # NO
    dynamic_compile: true

    # Training config
    gradient_accumulation_steps: 1
    clip_grad: 1.0
    clip_loss: 10
    
    seed: 42
    resume: null
    auto_resume: true
    start_epoch: 0
    global_step: 0
    world_size: 1
    rank: -1
    gpu: -1
    dist_on_itp: false
    find_unused_parameters: false

    # for distributed training
    distributed: false
    dist_url: env://
    dist_backend: "nccl"

    # Optimizer config
    optimizer:
        type: AdamW
        lr: 5e-5
        weight_decay: 5e-2
        betas: [0.9, 0.95]
        verbose: true
        filter_bias_and_bn: true

        encoder_lr: 5e-6

    lr_scheduler:
        type: OneCycleLR
        max_lr: ${train.optimizer.lr}
        pct_start: 0.0
        anneal_strategy: cos
        div_factor: 1000.0
        final_div_factor: 100.0
        total_steps: -1

test:
    num_workers: 16              # 16
    batch_size: 1              # not use, dynamic batch size
    print_freq: 10
    iters_per_test: -1
