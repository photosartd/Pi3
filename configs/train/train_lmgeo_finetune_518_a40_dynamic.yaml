# @package _global_

# Fixed 560x420 LMGeo fine-tuning profile sized for one 44.4 GiB A40 per rank.
#
# This is the conservative A40 profile:
# - Dynamic total views from 6 to 28.
# - Dataset split constraints allow 5-27 reference renders and 1-25 queries.
# - Six views has the unique split 5 refs + 1 query.
# - The old 32-view cases are no longer sampled because real A40 jobs OOMed
#   near the allocator limit.
# - Smaller sampled view counts pack multiple sequences per GPU through the
#   existing DynamicBatchSampler: floor(max_img_per_gpu / sampled_views).
#
# 560x420 matches LM-O's native 4:3 aspect ratio and both dimensions are
# divisible by Pi3/DINOv2's patch size 14. With the existing crop/resize path it
# retains substantially more of the source frame than a square target.
#
# Previous constrained probe on the local RTX PRO 6000 with only ~40 GB free:
# - 32-view training: 36,262 MiB allocated / 36,634 MiB reserved.
# - Packed 5 x 6-view training: 34,281 MiB allocated / 34,716 MiB reserved.
# - 31 refs + 1 query: 36,262 MiB allocated / 36,634 MiB reserved.
# - The pre-Ref16 production metrics at validation budget 128 had combined
#   peak reserve 38,246 MiB after the 32-view training step.
#
# Real CITEc A40 jobs then OOMed after a few training steps with 39.07 GiB
# allocated and 4.68 GiB reserved-but-unallocated, leaving only 183 MiB free on
# a 44.42 GiB GPU. The production default is therefore reduced to 28 views and
# a 28-image packing budget until an on-cluster 28-view + packed-6 smoke passes.

trainer: trainers.pi3_trainer.Pi3Trainer

lmgeo_profile:
  num_reference_range: [5, 27]
  num_query_range: [1, 25]
  filter_preprocessed_query_depth: true
  allow_repeat: true
  max_refetch: 50

train:
  # Total views per sample. The LMGeo dataset then chooses a valid split inside
  # lmgeo.num_reference_range and lmgeo.num_query_range.
  image_num_range: [6, 28]
  max_img_per_gpu: 28

  # One fixed 4:3 resolution for both LMGeo training and validation. The code
  # spelling of random_reslution is historical.
  resolution:
    - [560, 420]
  random_reslution: false

  num_workers: 0
  num_epoch: 30
  iters_per_epoch: 500
  val_every_n_epochs: 1
  print_freq: 1

  model_dtype: bf16
  dynamo_backend: NO
  dynamic_compile: false

  gradient_accumulation_steps: 1
  clip_grad: 1.0
  clip_loss: 100

  optimizer:
    lr: 5e-6
    encoder_lr: 0.0

  lr_scheduler:
    pct_start: 0.05

test:
  # The per-validation-set runtime sections in the data config override these.
  image_num_range: [6, 6]
  max_img_per_gpu: 128
  max_img_per_gpu_k5: 128
  max_img_per_gpu_k10: 128
  max_img_per_gpu_ref16: 128
  num_workers: 0
  iters_per_test: 0
  print_freq: 1

model:
  load_vggt: false
  freeze_encoder: true
  train_conf: false
  ckpt: ckpts/Pi3/model.safetensors

metrics:
  enabled: true
  train_enabled: false
  val_enabled: true
  train_every_n_steps: 5
  items:
    object_pose:
      _target_: pi3.metrics.object_pose.ObjectPoseMetric
      data_root: ${lmgeo.data_root}
      models_folder: ${lmgeo.models_folder}
      symmetric_ids: ${lmgeo.symmetric_ids}
      solve_scale: true
      max_model_points: 20000
      nn_chunk_size: 2048
      device: cuda
      # Raw ADD/ADD-S rows for failure-mode slicing. Build matching covariate
      # tables first, then enable coarse_analysis to log the 14 online scalars.
      raw_predictions_path: ${log.output_dir}/predictions.parquet
      run_id: ${name}
      masked: ${lmgeo.reference_rgb_masking}
      keyframe_seed: ${train.base_seed}
      covariates_path: ${log.output_dir}/covariates_{split}.parquet
      analysis_dir: ${log.output_dir}/failure_modes
      coarse_analysis: false
      hard_object_ids: []
    camera:
      _target_: pi3.metrics.camera.CameraAlignmentMetric
      solve_scale: true
    correspondence:
      _target_: pi3.metrics.correspondence.CorrespondenceMetric
      patch_size: 14
      max_reference_per_query: 2
      reference_selection: uniform
      max_pairs: 512
      pair_subsample: uniform
      depth_abs_tol: 0.01
      depth_rel_tol: 0.05
      huber_beta: 0.01
      use_dino_weights: false
      dino_layer: 17
      dino_center: 0.2
      dino_temperature: 0.1
      min_dino_weight: 0.05
    chamfer:
      _target_: pi3.metrics.chamfer.ReferenceChamferMetric
      data_root: ${lmgeo.data_root}
      models_folder: ${lmgeo.models_folder}
      solve_scale: true
      # High-res training-time validation uses a fast CUDA-only approximation:
      # mask/subsample reference point clouds on GPU and skip CPU voxelization.
      use_gpu_fast_path: true
      voxel_size_d: 0.01
      max_pred_points: 20000
      max_gt_points: 20000
      chunk_size: 1024
      device: cuda

visuals:
  # Keep visual logging off for the A40 memory target. The metric validation
  # loaders are the first thing to turn on; visuals can be enabled afterwards.
  enabled: false
  train_enabled: false
  val_enabled: false
  train_every_n_steps: 10
  val_every_n_epochs: 1
