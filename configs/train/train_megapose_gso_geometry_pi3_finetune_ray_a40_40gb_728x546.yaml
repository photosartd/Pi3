# @package _global_

# Same recipe as train_megapose_gso_geometry_pi3_finetune_ray_rtxpro6000_70gb_336x252
# at close to MegaPose-GSO's native rendered/scene resolution (720x540) and an
# A40 40 GiB budget. 728x546 is the nearest 4:3, patch_size=14-aligned
# resolution to 720x540 (52x39=2028 patch tokens/view, 4.69x the 432
# tokens/view at 336x252); 720x540 itself is not divisible by 14.
#
# max_img_per_gpu/test.max_img_per_gpu were determined empirically on
# 2026-08-20 the same way as the 560x420 sibling config: PI3_CUDA_MEMORY_LIMIT_GIB=40
# on a larger local GPU, sweeping images until OOM. Measured train ceiling:
# 18 images/GPU (3 six-view samples) at ~40.1 GiB reserved -- already at the
# cap. 12 images (2 samples) is used here for real margin on an actual A40.
#
# At only 2 samples/GPU, this needs many GPUs (or gradient accumulation) to
# reach an effective batch anywhere near the 26-sample/GPU 336x252 run this
# recipe was tuned on; see the smoke-test writeup before choosing this over
# the 560x420 sibling config.
defaults:
  - train_megapose_gso_geometry_pi3_finetune_ray_rtxpro6000_70gb_336x252
  - _self_

train:
  resolution:
    - [728, 546]
  max_img_per_gpu: 12

test:
  # Forward-only (no grad/optimizer state); 78 images/GPU measured
  # comfortable at ~14.1 GiB reserved under the same 40 GiB cap.
  max_img_per_gpu: 78
