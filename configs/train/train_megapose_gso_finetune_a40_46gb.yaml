# @package _global_

# Conservative NVIDIA A40 profile for strict MegaPose-GSO anchor-scene pairs.
# It retains fixed 560x420 inputs and the proven 28-image per-rank packing
# ceiling, while matching the anchor-pair logical view limits already used by
# the LMGeo A40 regime: 2-16 references plus 1-10 queries, 3-26 total views.
# The remaining two-image margin is intentional because visibility-mask
# conditioning adds inputs and real A40 runs previously rejected 32 views.
defaults:
  - train_megapose_gso_finetune_560
  - _self_

gso_profile:
  num_reference_range: [2, 16]
  num_query_range: [1, 10]
  max_refetch: 50

train:
  image_num_range: [3, 26]
  max_img_per_gpu: 28

  # Keep the first production run directly comparable with the established
  # object-centric A40 schedule. Hardware smoke must precede the long run.
  num_epoch: 30
  iters_per_epoch: 500
  lr_scheduler:
    pct_start: 0.10

test:
  image_num_range: [6, 6]
  max_img_per_gpu: 128

