# @package _global_

# Local 70 GiB production budget plus mesh-backed GSO query-pose evaluation.
defaults:
  - train_megapose_gso_finetune_rtxpro6000_blackwell_70gb_336x252_dynamic
  - _self_

metrics:
  items:
    object_pose:
      _target_: pi3.metrics.object_pose.ObjectPoseMetric
      data_root: ${gso.assets_root}
      models_folder: ${gso.models_folder}
      symmetric_ids: []
      solve_scale: true
      max_model_points: 20000
      nn_chunk_size: 2048
      device: cuda

