# @package _global_

# 518x518 LMGeo fine-tuning profile sized for a single 46 GB A40-class GPU.
#
# Pi3/DINOv2 uses a 14 px patch size, so 518 = 37 * 14 is the native high
# resolution used by the upstream model.
#
# Memory probe on the local RTX PRO 6000 with PyTorch 2.7.1+cu128:
# - 24 total views at 518x518 peaked at ~31.6 GB allocated.
# - 32 total views peaked at ~40.7 GB, but required repeated query views.
# - 36 total views peaked at ~45.2 GB, too close to a 46 GB A40 for comfort.
# - 38 total views exceeded 46 GB allocated.
#
# This config uses the practical unique-view setting: 5 reference renders + 19
# query images = 24 total views. It leaves meaningful headroom under 46 GB while
# preserving almost the same total view count as the old 25-view 224x224 setup.

trainer: trainers.pi3_trainer.Pi3Trainer

train:
  image_num_range: [24, 24]
  max_img_per_gpu: 24

  resolution:
    - [518, 518]

  num_workers: 0
  num_epoch: 30
  iters_per_epoch: 500
  print_freq: 1

  model_dtype: bf16
  dynamo_backend: NO
  dynamic_compile: false

  gradient_accumulation_steps: 1
  clip_grad: 1.0
  clip_loss: 100

  optimizer:
    lr: 5e-6
    encoder_lr: 0.0

  lr_scheduler:
    pct_start: 0.05

test:
  # Validation keeps the 5-reference + 1-query BOP protocol. No backward pass
  # is run during validation, so this remains much cheaper than training.
  image_num_range: [6, 6]
  max_img_per_gpu: 6
  num_workers: 0
  iters_per_test: 0
  print_freq: 1

model:
  load_vggt: false
  freeze_encoder: true
  train_conf: false
  ckpt: ckpts/Pi3/model.safetensors

metrics:
  enabled: true
  train_enabled: false
  val_enabled: true
  train_every_n_steps: 5
  items:
    object_pose:
      _target_: pi3.metrics.object_pose.ObjectPoseMetric
      data_root: ${lmgeo.data_root}
      models_folder: ${lmgeo.models_folder}
      symmetric_ids: ${lmgeo.symmetric_ids}
      solve_scale: true
      max_model_points: 20000
      nn_chunk_size: 2048
      device: cuda
    camera:
      _target_: pi3.metrics.camera.CameraAlignmentMetric
      solve_scale: true
    chamfer:
      _target_: pi3.metrics.chamfer.ReferenceChamferMetric
      data_root: ${lmgeo.data_root}
      models_folder: ${lmgeo.models_folder}
      solve_scale: true
      voxel_size_d: 0.01
      max_pred_points: 20000
      max_gt_points: 20000
      chunk_size: 1024
      device: cuda

visuals:
  # Enable after the first memory probe if visual logs are needed. Keeping them
  # off makes the A40 target profile easier to reason about.
  enabled: false
  train_enabled: false
  val_enabled: true
  train_every_n_steps: 10
  val_every_n_epochs: 1
