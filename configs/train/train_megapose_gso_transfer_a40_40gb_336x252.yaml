# @package _global_

# A40 hardware delta for the 80-epoch transfer-diagnostic profile. The model,
# optimizer, warm-up, validation cadence, and mask-conditioning settings remain
# identical to the 70 GiB profile; only the already measured 40 GiB image
# budgets are restored. Query-full-depth loss has the same model activations,
# but its larger valid-pixel selection must still pass the cluster smoke.
defaults:
  - train_megapose_gso_transfer_rtxpro6000_blackwell_70gb_336x252
  - _self_

train:
  max_img_per_gpu: 72

test:
  max_img_per_gpu: 256
  max_img_per_gpu_ref16: 256
  max_img_per_gpu_k5: 256
  max_img_per_gpu_k10: 256
  num_workers: 2
  persistent_workers: false
  prefetch_factor: 2
