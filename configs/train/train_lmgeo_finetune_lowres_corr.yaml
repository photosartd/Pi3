# @package _global_

# Fine-tuning config with the GT correspondence consistency loss enabled.
# This is intentionally separate from train_lmgeo_finetune_lowres.yaml so
# baseline runs stay directly comparable.

trainer: trainers.pi3_trainer.Pi3Trainer

lmgeo_profile:
  num_reference_range: [5, 6]
  num_query_range: [1, 20]
  filter_preprocessed_query_depth: false
  allow_repeat: false
  max_refetch: 3

train:
  image_num_range: [6, 26]
  max_img_per_gpu: 50

  resolution:
    - [224, 224]

  num_workers: 0
  num_epoch: 30
  iters_per_epoch: 500
  print_freq: 1

  model_dtype: bf16
  dynamo_backend: NO
  dynamic_compile: false

  gradient_accumulation_steps: 1
  clip_grad: 1.0
  clip_loss: 100

  optimizer:
    lr: 5e-6
    encoder_lr: 0.0

  lr_scheduler:
    pct_start: 0.05

test:
  image_num_range: [6, 6]
  max_img_per_gpu: 96
  max_img_per_gpu_k5: 96
  max_img_per_gpu_k10: 96
  max_img_per_gpu_ref16: 96
  num_workers: 0
  iters_per_test: 0
  print_freq: 1

model:
  load_vggt: false
  freeze_encoder: true
  train_conf: false
  ckpt: ckpts/Pi3/model.safetensors
  # Exposes frozen DINO layer-17 tokens from the existing encoder pass.
  dino_output_layers: [17]

loss:
  train_loss:
    _target_: pi3.models.loss.Pi3Loss
    train_conf: false
    correspondence_weight: 0.1
    correspondence_patch_size: 14
    correspondence_max_reference_per_query: 2
    correspondence_reference_selection: uniform
    correspondence_max_pairs: 512
    correspondence_pair_subsample: uniform
    correspondence_depth_abs_tol: 0.01
    correspondence_depth_rel_tol: 0.05
    correspondence_huber_beta: 0.01
    correspondence_use_dino_weights: true
    correspondence_dino_layer: 17
    correspondence_dino_center: 0.2
    correspondence_dino_temperature: 0.1
    correspondence_min_dino_weight: 0.05
  test_loss:
    _target_: pi3.models.loss.Pi3Loss
    train_conf: false
    correspondence_weight: 0.1
    correspondence_patch_size: 14
    correspondence_max_reference_per_query: 2
    correspondence_reference_selection: uniform
    correspondence_max_pairs: 512
    correspondence_pair_subsample: uniform
    correspondence_depth_abs_tol: 0.01
    correspondence_depth_rel_tol: 0.05
    correspondence_huber_beta: 0.01
    correspondence_use_dino_weights: true
    correspondence_dino_layer: 17
    correspondence_dino_center: 0.2
    correspondence_dino_temperature: 0.1
    correspondence_min_dino_weight: 0.05

metrics:
  enabled: true
  train_enabled: false
  val_enabled: true
  train_every_n_steps: 5
  items:
    object_pose:
      _target_: pi3.metrics.object_pose.ObjectPoseMetric
      data_root: ${lmgeo.data_root}
      models_folder: ${lmgeo.models_folder}
      symmetric_ids: ${lmgeo.symmetric_ids}
      solve_scale: true
      max_model_points: 20000
      nn_chunk_size: 2048
      device: cuda
    camera:
      _target_: pi3.metrics.camera.CameraAlignmentMetric
      solve_scale: true
    chamfer:
      _target_: pi3.metrics.chamfer.ReferenceChamferMetric
      data_root: ${lmgeo.data_root}
      models_folder: ${lmgeo.models_folder}
      solve_scale: true
      voxel_size_d: 0.01
      max_pred_points: 20000
      max_gt_points: 20000
      chunk_size: 1024
      device: cuda

visuals:
  enabled: true
  train_enabled: false
  val_enabled: true
  train_every_n_steps: 10
  val_every_n_epochs: 1
  items:
    input_reference_frames:
      _target_: pi3.visualizations.input_frames.InputFramesVisualizer
      role: reference
      max_views: 6
      thumbnail_size: 128
      columns: 6
    input_query_frames:
      _target_: pi3.visualizations.input_frames.InputFramesVisualizer
      role: query
      max_views: 6
      thumbnail_size: 128
      columns: 6
    correspondence:
      _target_: pi3.visualizations.correspondence.CorrespondenceVisualizer
      patch_size: 14
      max_reference_per_query: 2
      reference_selection: uniform
      max_pairs: 512
      pair_subsample: uniform
      depth_abs_tol: 0.01
      depth_rel_tol: 0.05
      dino_layer: 17
      max_draw: 120
    query_pose_overlay:
      _target_: pi3.visualizations.pose_overlay.QueryPoseOverlayVisualizer
      data_root: ${lmgeo.data_root}
      models_folder: ${lmgeo.models_folder}
      solve_scale: true
      max_model_points: 20000
      max_query_views: 3
    depth_panel:
      _target_: pi3.visualizations.depth_panel.DepthPanelVisualizer
      include_reference: true
      include_query: true
    reference_reconstruction:
      _target_: pi3.visualizations.reconstruction.ReferenceReconstructionVisualizer
      solve_scale: true
      voxel_size: null
      max_pred_points: 12000
      max_gt_points: 12000
      size: 320
